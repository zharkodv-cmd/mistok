<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #1e1e22; --panel: #131316; --border: #2e2e34;
    --text: #e6e6ea; --muted: #8a8a93; --dim: #7f7f89;
    --ok: #4ade80; --err: #f87171; --pend: #fbbf24; --accent: #7dd3fc;
  }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    margin: 0; padding: 8px; font-size: 11px;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 7px; flex: none; }
  #dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--pend); transition: background .2s;
  }
  #dot.ok  { background: var(--ok);  box-shadow: 0 0 6px rgba(74,222,128,.6); }
  #dot.err { background: var(--err); box-shadow: 0 0 6px rgba(248,113,113,.5); }
  #dot.pending { background: var(--pend); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* назва вже у тайтл-барі Figma — у відкритому режимі не дублюємо */
  #brand { display: none; font-weight: 600; letter-spacing: .2px; }
  #status { font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); }
  #count {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 9px; padding: 1px 7px;
    margin-left: auto;
  }
  #count.active {
    color: var(--accent);
    background: rgba(125,211,252,.08); border-color: rgba(125,211,252,.18);
  }
  button { transition: background .15s; }
  button:active { transform: translateY(1px); }
  #killBtn { display: none; color: var(--err); }
  #killBtn.on { display: grid; }
  #toggle, #undoBtn, #killBtn {
    border: 1px solid var(--border); background: transparent; border-radius: 5px;
    width: 22px; height: 22px; cursor: pointer; color: var(--muted);
    font-size: 14px; padding: 0; flex: none;
    display: grid; place-items: center;
  }
  #toggle:hover, #undoBtn:hover, #killBtn:hover { background: var(--panel); color: var(--text); }
  body.mini #undoBtn, body.mini #killBtn { display: none !important; }

  #summary {
    font-size: 10px; color: var(--dim); font-style: italic; flex: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #summary:empty, #limits:empty, #sel:empty, #ops:empty { display: none; }

  #ops { display: flex; flex-wrap: wrap; gap: 5px; flex: none; }
  #ops:empty { display: none; }
  #ops button {
    flex: 1 1 calc(20% - 5px); height: 30px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 6px; color: var(--muted); cursor: pointer; padding: 0;
    display: grid; place-items: center; font-size: 13px;
  }
  #ops button:hover { background: var(--bg); color: var(--text); border-color: #3c3c44; }
  #ops button svg, #sel button svg { display: block; }
  #ops button.on { color: var(--accent); border-color: rgba(125,211,252,.35); }

  #secform { display: none; gap: 6px; align-items: center; flex: none; }
  #secform.open { display: flex; }
  #secform label {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace;
  }
  #secform input {
    width: 52px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 11px; padding: 3px 5px;
    font-family: ui-monospace, monospace;
  }
  #secform input:focus { outline: none; border-color: rgba(125,211,252,.4); }
  #secform button {
    flex: none; margin-left: auto; height: 24px; padding: 0 14px; white-space: nowrap;
    border: 1px solid rgba(125,211,252,.35); background: rgba(125,211,252,.08);
    border-radius: 4px; color: var(--accent); cursor: pointer; font-size: 11px;
  }
  #secform button:hover { background: rgba(125,211,252,.16); }

  #sel {
    display: flex; align-items: center; gap: 6px; flex: none;
    font-family: ui-monospace, monospace;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 7px;
  }
  #sel .selid { color: var(--accent); }
  #sel .selname { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sel .selmeta { color: var(--muted); font-size: 10px; flex: none; }
  #sel button {
    flex: none; width: 26px; height: 24px; border: 1px solid var(--border);
    background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer;
    padding: 0; display: grid; place-items: center; font-size: 12px;
  }
  #sel button:first-of-type { margin-left: auto; }
  #sel button:hover { background: var(--bg); color: var(--text); }

  #limits { flex: none; display: flex; flex-direction: column; gap: 5px; }
  .lim .lrow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; margin-bottom: 2px;
  }
  .lim .lname { color: var(--text); font-weight: 500; font-size: 11px; }
  .lim .lmeta { color: var(--muted); font-family: ui-monospace, monospace; }
  .lim .track {
    height: 4px; border-radius: 2px; background: var(--border); overflow: hidden;
  }
  /* fill = скільки ЛИШИЛОСЬ (збігається з підписом «N% left») */
  .lim .fill { height: 100%; border-radius: 2px; background: var(--ok); transition: width .3s; }
  .lim .fill.warn { background: var(--pend); }
  .lim .fill.hot { background: var(--err); }

  #chatBox {
    flex: none; display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px;
  }
  body.mini #chatBox { display: none; }
  #chatOut {
    display: none; flex: none; flex-direction: column; gap: 6px;
    max-height: 240px; overflow-y: auto;
  }
  #chatOut.open { display: flex; }
  .msg {
    max-width: 86%; padding: 6px 9px; border-radius: 9px;
    font-size: 10.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    align-self: flex-end; background: rgba(125,211,252,.10);
    border: 1px solid rgba(125,211,252,.22); color: var(--text);
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--bg);
    border: 1px solid var(--border); color: var(--text);
    border-bottom-left-radius: 3px;
  }
  .msg.bot.thinking { color: var(--muted); font-style: italic; }
  .msg img { display: block; max-width: 100%; border-radius: 6px; margin-top: 6px; border: 1px solid var(--border); }
  .msg .rmres {
    display: inline-block; margin-top: 6px; padding: 2px 8px; font-size: 10px;
    border: 1px solid var(--border); border-radius: 4px; background: transparent;
    color: var(--muted); cursor: pointer;
  }
  .msg .rmres:hover { color: var(--err); border-color: rgba(248,113,113,.4); }
  #chatRow { flex: none; display: flex; gap: 5px; }
  #chatIn {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 11px; padding: 6px 8px;
    font-family: inherit;
  }
  #chatMeta { flex: none; display: flex; gap: 4px; align-items: center; }
  #chatMeta .mlabel { font-size: 9px; color: var(--dim); }
  #chatMeta select + .mlabel { margin-left: 8px; }
  #chatMeta select {
    background: transparent; border: none; color: var(--dim); font-size: 10px;
    padding: 0; font-family: ui-monospace, monospace; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #chatMeta select:hover, #chatMeta select:focus { color: var(--text); outline: none; }
  body.mini #chatMeta { display: none; }
  #chatIn:focus { outline: none; border-color: rgba(125,211,252,.4); }
  #chatIn::placeholder { color: var(--dim); }

  /* робота: крапка пульсує акцентом, поруч — назва задачі */
  #dot.busy { background: var(--accent); box-shadow: 0 0 6px rgba(125,211,252,.6); animation: pulse 1s infinite; }

  /* миттєвий тултіп: коротка назва дії */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
    background: #0c0c0e; color: var(--text); font-size: 9.5px; line-height: 1;
    padding: 4px 7px; border-radius: 4px; border: 1px solid var(--border);
    white-space: nowrap; pointer-events: none; z-index: 10;
  }

  /* згорнутий режим — темна пігулка */
  body.mini { padding: 0; cursor: pointer; display: block; }
  body.mini .row { margin: 0; height: 36px; padding: 0 10px; gap: 6px; }
  body.mini:hover { background: var(--panel); }
  body.mini #server, body.mini #status, body.mini #count,
  body.mini body.mini #summary, body.mini #limits, body.mini #sel,
  body.mini #ops, body.mini #secform, body.mini #chatOut, body.mini #chatRow { display: none; }
  body.mini #brand { display: inline; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <span id="dot" class="pending"></span>
    <span id="brand">Mistok</span>
    <span id="status" title="ws://localhost:8787/plugin">connecting…</span>
    <span id="count" title="execs this bridge session">0</span>
    <button id="killBtn" data-tip="Cancel" title="Cancel running background task">✕</button>
    <button id="undoBtn" data-tip="Undo" title="Undo last action (triggerUndo)"></button>
    <button id="toggle" title="Collapse / expand">–</button>
  </div>
  <div id="limits"></div>
  <div id="sel"></div>
  <div id="ops"></div>
  <div id="secform">
    <label>pad <input id="secPad" type="number" value="250"></label>
    <label>gap <input id="secGap" type="number" value="100"></label>
    <label>cols <input id="secCols" type="number" value="1" min="1"></label>
    <button id="secApply" title="Wrap into a section and lay out">Apply</button>
  </div>
  <div id="summary"></div>
  <div id="chatBox">
  <div id="chatOut"></div>
  <div id="chatRow">
    <input id="chatIn" type="text" placeholder="Ask Claude… (Enter)">
  </div>
  <div id="chatMeta">
    <span class="mlabel">✦</span>
    <select id="mSel" title="Model for chat tasks">
      <option value="">auto</option>
      <option value="haiku">haiku</option>
      <option value="sonnet">sonnet</option>
      <option value="opus">opus</option>
      <option value="claude-fable-5">fable</option>
    </select>
    <span class="mlabel">↯</span>
    <select id="eSel" title="Effort for chat tasks">
      <option value="">auto</option>
      <option value="low">low</option>
      <option value="medium">medium</option>
      <option value="high">high</option>
    </select>
  </div>
  </div>

<script>
const SERVER = "ws://localhost:8787/plugin";
const dotEl = document.getElementById("dot");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
let ws = null;
let reconnectTimer = null;
let execCount = 0;


function log(_line) {} // лог-панель прибрано; події видно через статус-дот і figma.notify

function setStatus(text, cls) {
  statusEl.textContent = text;
  dotEl.className = cls;
}

function setCount(n) {
  countEl.textContent = n;
  countEl.classList.toggle("active", n > 0);
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : "?";
}

// ── лоадер з чергою задач ────────────────────────────────────────────────
const activeTasks = new Map(); // key → label
let busySince = 0;
function renderTasks() {
  const labels = [...activeTasks.values()];
  if (labels.length) {
    busySince = Date.now();
    dotEl.classList.add("busy");
    statusEl.textContent = labels[0] + (labels.length > 1 ? " · +" + (labels.length - 1) : "");
  } else {
    const wait = Math.max(0, 700 - (Date.now() - busySince));
    setTimeout(() => {
      if (!activeTasks.size) {
        dotEl.classList.remove("busy");
        if (ws && ws.readyState === WebSocket.OPEN) statusEl.textContent = "";
      }
    }, wait);
  }
  fitHeight();
}
function setBtnBusy(kind, on) {
  const btn = document.querySelector('#ops button[data-kind="' + kind + '"]');
  if (btn) { btn.disabled = on; btn.style.opacity = on ? ".35" : ""; btn.style.pointerEvents = on ? "none" : ""; }
}
function taskKind(key) { return key.startsWith("op:") || key.startsWith("bg:") ? key.slice(3) : null; }
function refreshKill() {
  const hasBg = [...activeTasks.keys()].some((k) => k.startsWith("bg:") || k === "chat");
  document.getElementById("killBtn").classList.toggle("on", hasBg);
}
function startTask(key, label) {
  activeTasks.set(key, label);
  const k = taskKind(key); if (k) setBtnBusy(k, true);
  refreshKill(); renderTasks();
}
function updateTask(key, label) { if (activeTasks.has(key)) { activeTasks.set(key, label); renderTasks(); } }
function endTask(key) {
  if (activeTasks.delete(key)) {
    const k = taskKind(key);
    if (k && ![...activeTasks.keys()].some((x) => taskKind(x) === k)) setBtnBusy(k, false);
    refreshKill(); renderTasks();
  }
}
// сумісність зі старими викликами busy(±1) для чат-потоку
function busy() {}

// ── Claude usage stats (pushed by bridge every 60s) ─────────────────────
function fmtReset(iso) {
  if (!iso) return "";
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "";
  const m = Math.round(ms / 60000);
  const h = Math.floor(m / 60);
  if (h >= 48) return "in " + Math.round(h / 24) + "d";
  return "in " + (h ? h + "h " + (m % 60) + "m" : m + "m");
}
const LIM_NAMES = { session: "Session", weekly_all: "Weekly" };
const limNotified = {};
function renderStats(s) {
  const c = s.claude || {};
  document.getElementById("summary").textContent = c.summary || "";

  if (s.execs != null) {
    execCount = s.execs;
    setCount(s.execs);
    countEl.title = "execs this bridge session" +
                    (s.avg_ms != null ? " · avg " + s.avg_ms + "ms" : "") +
                    (s.errors ? " · errors " + s.errors : "");
  }

  const lims = (s.limits || []).filter(l => LIM_NAMES[l.kind] || (l.model && l.percent > 0));
  // попередження при підході до ліміту — раз на вікно ресету, поріг = «гарячий» бар
  lims.forEach(l => {
    const hot = (l.percent || 0) >= 80 || l.severity === "critical" || l.severity === "high";
    const key = l.kind + (l.resets_at || "");
    if (hot && !limNotified[key]) {
      limNotified[key] = true;
      parent.postMessage({ pluginMessage: { type: "notify",
        text: "Claude " + (LIM_NAMES[l.kind] || l.model) + ": " + (100 - l.percent) + "% left" } }, "*");
    }
  });
  document.getElementById("limits").innerHTML = lims.map(l => {
    const used = Math.max(0, Math.min(100, l.percent || 0));
    const left = 100 - used;
    const cls = used >= 80 || l.severity === "critical" ? "hot"
              : used >= 50 || l.severity === "warning" ? "warn" : "";
    const name = LIM_NAMES[l.kind] || l.model;
    return '<div class="lim">' +
      '<div class="lrow"><span class="lname">' + name + "</span>" +
      '<span class="lmeta">' + left + "% left · " + fmtReset(l.resets_at) + "</span></div>" +
      '<div class="track"><div class="fill ' + cls + '" style="width:' + left + '%"></div></div></div>';
  }).join("");
  fitHeight();
}

function connect() {
  clearTimeout(reconnectTimer);
  setStatus("connecting…", "pending");
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setStatus("", "ok");
    log("[ws] connected");
    try { ws.send(JSON.stringify({ type: "hello", version: "2.1" })); } catch (e) {}
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      setCount(++execCount);
      parent.postMessage({ pluginMessage: { type: "exec", id: msg.id, code: msg.code } }, "*");
    } else if (msg.type === "stats") {
      renderStats(msg);
    } else if (msg.type === "chatstatus") {
      const key = msg.task && msg.task !== "chat" ? "bg:" + msg.task : "chat";
      if (activeTasks.has(key)) updateTask(key, msg.text);
      else startTask(key, msg.text);
      chatShow(msg.text, true);
    } else if (msg.type === "chatreply") {
      if (msg.task && msg.task !== "chat") endTask("bg:" + msg.task);
      else endTask("chat");
      chatShow(msg.text, false, msg.img || null, msg.node || null);
    } else if (msg.type === "ping") {
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    }
  };

  ws.onerror = () => {
    setStatus("error", "err");
    log("[ws] error");
  };

  ws.onclose = () => {
    if (pendingMsg) { pendingMsg.textContent = "(connection lost)"; pendingMsg.classList.remove("thinking"); pendingMsg = null; }
    setStatus("retrying…", "err");
    log("[ws] disconnected");
    reconnectTimer = setTimeout(connect, 2000);
  };
}

// ── undo ─────────────────────────────────────────────────────────────────
const undoBtn = document.getElementById("undoBtn");
undoBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M6.5 3.5L3 7l3.5 3.5"/><path d="M3 7h6.5a3.5 3.5 0 013.5 3.5v2"/></svg>';
document.getElementById("killBtn").onclick = (e) => {
  e.stopPropagation();
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "kill" }));
};
undoBtn.onclick = (e) => {
  e.stopPropagation();
  parent.postMessage({ pluginMessage: { type: "undo" } }, "*");
};

// ── чат із Claude (headless через bridge) ────────────────────────────────
const chatOut = document.getElementById("chatOut");
const chatIn = document.getElementById("chatIn");
let pendingMsg = null; // елемент «thinking…», що чекає на відповідь
let histArr = [];      // персистентна історія (текст, без картинок)
let histTimer = null;
function saveHist() {
  clearTimeout(histTimer);
  histTimer = setTimeout(() => {
    parent.postMessage({ pluginMessage: { type: "chathist", hist: histArr.slice(-40) } }, "*");
  }, 800);
}
function addMsg(role, text, thinking, skipHist) {
  const d = document.createElement("div");
  d.className = "msg " + role + (thinking ? " thinking" : "");
  d.textContent = text;
  chatOut.appendChild(d);
  while (chatOut.children.length > 40) chatOut.firstChild.remove();
  chatOut.classList.add("open");
  chatOut.scrollTop = chatOut.scrollHeight;
  if (!thinking && !skipHist) { histArr.push({ r: role, t: text }); saveHist(); }
  fitHeight();
  return d;
}
function chatShow(text, thinking, img, node) {
  if (thinking) {
    if (pendingMsg) { pendingMsg.textContent = text; }
    else pendingMsg = addMsg("bot", text, true);
  } else {
    let el;
    if (pendingMsg) {
      pendingMsg.classList.remove("thinking");
      pendingMsg.textContent = text;
      el = pendingMsg;
      pendingMsg = null;
      histArr.push({ r: "bot", t: text });
      saveHist();
    } else el = addMsg("bot", text);
    if (img) {
      const im = document.createElement("img");
      im.src = img;
      el.appendChild(im);
      im.onload = () => { chatOut.scrollTop = chatOut.scrollHeight; fitHeight(); };
    }
    if (node) {
      const rb = document.createElement("button");
      rb.className = "rmres";
      rb.textContent = "✕ remove result";
      rb.onclick = () => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "rmnode", id: node }));
        rb.textContent = "removed";
        rb.disabled = true;
      };
      el.appendChild(rb);
    }
  }
  chatOut.scrollTop = chatOut.scrollHeight;
  fitHeight();
}
const mSel = document.getElementById("mSel");
const eSel = document.getElementById("eSel");
// зберігаємо вибір через clientStorage (code.js)
function savePrefs() {
  parent.postMessage({ pluginMessage: { type: "prefs", model: mSel.value, effort: eSel.value } }, "*");
}
mSel.onchange = savePrefs;
eSel.onchange = savePrefs;

chatIn.onkeydown = (e) => {
  if (e.key !== "Enter") return;
  const text = chatIn.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) { chatShow("bridge disconnected", false); return; }
  ws.send(JSON.stringify({ type: "chat", text, model: mSel.value || null, effort: eSel.value || null }));
  chatIn.value = "";
  addMsg("user", text);
  const isUrl = text.startsWith("http://") || text.startsWith("https://");
  startTask("chat", isUrl ? "importing page…" : "Claude: " + text.slice(0, 28) + "…");
  chatShow("thinking…", true);
};

// ── selection row ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}
function copyText(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function flash(btn, glyphHTML, revertHTML) {
  btn.innerHTML = glyphHTML;
  setTimeout(() => { btn.innerHTML = revertHTML; }, 900);
}
const I = (paths) =>
  '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";
const ICONS = {
  clean: I('<path d="M12.5 2.5L7 8"/><path d="M6.2 8.8l-2.9 3.4c-.5.6-.3 1.3.4 1.5l1.6.4c1.9.4 3.4-.4 4-2.2l.6-1.7-3.7-1.4z" fill="currentColor" stroke="none"/><path d="M13.5 5.5h-2M12.8 7.8l-1.4-.7"/>'),

const OP_BTNS = [
  { kind: "clean", tip: "Clean", title: "Logical folders + rename (bg/image/item…) + ungroup + whole px" },
  { kind: "varsal", tip: "Spacing", title: "Auto-layout paddings/gaps → nearest variables" },
  { kind: "varscolor", tip: "Colors", title: "Colors/text → nearest variables (scope-aware)" },
  { kind: "textstyle", tip: "Styles", title: "Text nodes → local Text Styles (family+style+size)" },
  { kind: "autolayout", tip: "Layout", title: "Organize free-placed elements into logical auto-layout (rows/cols, bg → absolute)" },
  { kind: "sectionize", tip: "Section", title: "Wrap selection into a Section (pad/gap below)" },
  { kind: "grid", tip: "Grid", title: "Snap children to the frame layout grid (x/w to columns, y to 8px)" },
  { kind: "imgreuse", tip: "Reuse", title: "Placeholders ← relevant images from the whole file" },
  { kind: "imggen", tip: "Magnific", title: "Premium photo request via Magnific → executed by Claude" },
  { kind: "spell", tip: "Spell", title: "Spellcheck all texts via headless Claude: fixes applied automatically" },
  { kind: "redesign", tip: "Redesign", title: "Any selection → awwwards reference hunt → redesigned with impeccable craft → executed by Claude" },
  { kind: "prototype", tip: "Prototype", title: "Wireframe/sketch/texts → minimalist b/w prototype (Inter) → executed by Claude" },
  { kind: "lint", tip: "Lint", title: "Read-only audit: unbound colors/spacing, missing text styles, default names, fractional px, off-grid" },
  { kind: "contrast", tip: "Contrast", title: "Read-only WCAG AA contrast check of texts against their actual backgrounds" },
  { kind: "recreate", tip: "Design", title: "Screenshot → pixel-perfect editable recreation in Figma → executed by Claude" },
];
function renderOps(show) {
  const el = document.getElementById("ops");
  const form = document.getElementById("secform");
  if (!show) { el.innerHTML = ""; form.classList.remove("open"); return; }
  el.innerHTML = OP_BTNS.map((b) =>
    '<button data-kind="' + b.kind + '" data-tip="' + b.tip + '" title="' + b.title + '">' +
    ICONS[b.kind] + "</button>").join("");
  el.querySelectorAll("button").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (btn.dataset.kind === "sectionize") {
        form.classList.toggle("open");
        btn.classList.toggle("on", form.classList.contains("open"));
        fitHeight();
        return;
      }
      parent.postMessage({ pluginMessage: { type: "op", kind: btn.dataset.kind,
        params: { model: mSel.value || null, effort: eSel.value || null } } }, "*");
      startTask("op:" + btn.dataset.kind, (OP_BTNS.find((b) => b.kind === btn.dataset.kind) || {}).tip + "…");
      flash(btn, ICONS.wait, ICONS[btn.dataset.kind]);
    };
  });
}
document.getElementById("secApply").onclick = (e) => {
  e.stopPropagation();
  parent.postMessage({ pluginMessage: { type: "op", kind: "sectionize", params: {
    pad: Number(document.getElementById("secPad").value) || 250,
    gap: Number(document.getElementById("secGap").value) || 100,
    cols: Number(document.getElementById("secCols").value) || 1,
  } } }, "*");
};

function renderSel(m) {
  const el = document.getElementById("sel");
  renderOps(m.nodes && m.nodes.length);
  if (!m.nodes || !m.nodes.length) { el.innerHTML = ""; fitHeight(); return; }
  const n = m.nodes[0];
  const more = m.total > 1 ? " +" + (m.total - 1) : "";
  el.innerHTML =
    '<span class="selid">' + escHtml(n.id) + "</span>" +
    '<span class="selname">' + escHtml(n.name) + "</span>" +
    '<span class="selmeta">' + n.w + "×" + n.h + more + "</span>" +
    '<button id="copySel" data-tip="Copy id" title="Copy node id">' + ICONS.copy + "</button>" +
    '<button id="implSel" data-tip="Implement" title="Copy an implement-this-design prompt for Claude Code">' + ICONS.impl + "</button>" +
    '<button id="shotSel" data-tip="Shot" title="PNG @2x → clipboard + Desktop/mistok-shots">' + ICONS.shot + "</button>";
  const copyBtn = document.getElementById("copySel");
  copyBtn.onclick = (e) => {
    e.stopPropagation();
    copyText(m.nodes.map((x) => x.id).join(","));
    flash(copyBtn, ICONS.ok, ICONS.copy);
  };
  const implBtn = document.getElementById("implSel");
  implBtn.onclick = (e) => {
    e.stopPropagation();
    const list = m.nodes.map((x) => "`" + x.id + "` «" + x.name + "» (" + x.w + "×" + x.h + ")").join(", ");
    const ids = m.nodes.map((x) => x.id);
    copyText(
      "Implement this design from Figma (Mistok bridge):\n" +
      "- node" + (ids.length > 1 ? "s" : "") + ": " + list + "\n" +
      "- spec: mistok spec " + ids[0] + " --depth 6\n" +
      "- screenshot: mistok shot " + ids[0] + " /tmp/design.png --scale 2\n" +
      "Follow the project rules (.claude/rules/mistok.md): exact texts, colors as variables, spacing in rem."
    );
    flash(implBtn, ICONS.ok, ICONS.impl);
  };
  const shotBtn = document.getElementById("shotSel");
  shotBtn.onclick = (e) => {
    e.stopPropagation();
    parent.postMessage({ pluginMessage: { type: "shotsel" } }, "*");
    flash(shotBtn, ICONS.wait, ICONS.shot);
  };
  fitHeight();
}

// ── згортання ────────────────────────────────────────────────────────────
let mini = false;
const toggleEl = document.getElementById("toggle");

function setMini(next, tell) {
  mini = next;
  document.body.classList.toggle("mini", mini);
  toggleEl.textContent = mini ? "+" : "–";
  if (tell) parent.postMessage({ pluginMessage: { type: "ui", mini } }, "*");
  if (!mini) fitHeight();
}

// авто-висота: вікно підганяється під контент
// (scrollHeight body завжди ≥ висоти вікна, тому міряємо низ останнього видимого блока)
function contentHeight() {
  let max = 0;
  for (const el of document.body.children) {
    if (el.tagName === "SCRIPT") continue;
    const r = el.getBoundingClientRect();
    if (r.height > 0) max = Math.max(max, r.bottom);
  }
  return Math.ceil(max + 8); // нижній padding
}
function fitHeight() {
  if (mini) return;
  requestAnimationFrame(() => {
    parent.postMessage({ pluginMessage: { type: "resize", h: contentHeight() } }, "*");
  });
}

toggleEl.onclick = (e) => { e.stopPropagation(); setMini(!mini, true); };
// у згорнутому стані клік будь-де розгортає
document.body.onclick = () => { if (mini) setMini(false, true); };

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "uistate") { setMini(!!m.mini, false); return; }
  if (m.type === "chathiststate") {
    histArr = Array.isArray(m.hist) ? m.hist : [];
    for (const h of histArr) addMsg(h.r === "user" ? "user" : "bot", h.t, false, true);
    return;
  }
  if (m.type === "prefsstate") {
    if (m.model != null) mSel.value = m.model;
    if (m.effort != null) eSel.value = m.effort;
    return;
  }
  if (m.type === "selection") { renderSel(m); return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try { ws.send(JSON.stringify(m)); } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
  else if (m.type === "file") log(`[shot] ${m.name} → clipboard + mistok-shots`);
  else if (m.type === "opreport") {
    endTask("op:" + m.kind);
    // фонова вичитка триває після opreport — тримаємо лоадер до chatreply
    const BG_LABELS = { spell: "spellchecking (Claude)…", autolayout: "auto-layout planning (Claude)…",
      recreate: "recreating design (Claude)…", redesign: "redesigning (Claude)…", prototype: "building prototype (Claude)…",
      imggen: "fetching photos (Freepik)…" };
    if (BG_LABELS[m.kind] && !m.error) startTask("bg:" + m.kind, BG_LABELS[m.kind]);
  }
  else if (m.type === "log") {/* skip — would spam */}
};

log("[ui] booting");
connect();
fitHeight();
</script>
