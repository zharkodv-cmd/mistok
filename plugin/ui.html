<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #1e1e22; --panel: #131316; --border: #2e2e34;
    --text: #e6e6ea; --muted: #8a8a93;
    --ok: #4ade80; --err: #f87171; --pend: #fbbf24; --accent: #7dd3fc;
  }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    margin: 0; padding: 8px; font-size: 12px;
    background: var(--bg); color: var(--text);
  }
  .row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  #dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--pend); transition: background .2s;
  }
  #dot.ok  { background: var(--ok);  box-shadow: 0 0 6px rgba(74,222,128,.6); }
  #dot.err { background: var(--err); box-shadow: 0 0 6px rgba(248,113,113,.5); }
  #dot.pending { background: var(--pend); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* назва вже у тайтл-барі Figma — у відкритому режимі не дублюємо */
  #brand { display: none; font-weight: 600; font-size: 11px; letter-spacing: .2px; }
  #status { font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); }
  #count {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--accent);
    background: rgba(125,211,252,.08); border: 1px solid rgba(125,211,252,.18);
    border-radius: 9px; padding: 1px 7px;
  }
  #server { color: var(--muted); font-size: 10px; font-family: ui-monospace, monospace;
            margin-left: auto; }
  #toggle {
    border: 1px solid var(--border); background: transparent; border-radius: 5px;
    width: 22px; height: 22px; line-height: 1; cursor: pointer; color: var(--muted);
    font-size: 14px; padding: 0; flex: none;
  }
  #toggle:hover { background: var(--panel); color: var(--text); }
  #log {
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 6px; height: 138px; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", monospace; font-size: 10.5px;
    line-height: 1.5; margin: 0; white-space: pre-wrap; word-break: break-all;
  }
  #log .t { color: #55555e; }
  #log .ok { color: var(--ok); }
  #log .err { color: var(--err); }
  #log .exec { color: var(--accent); }
  #log .mut { color: var(--pend); }
  #log .ws { color: var(--muted); }
  #log div { min-height: 1em; }

  #stats {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #stats b { color: var(--text); font-weight: 500; }
  #stats .up { color: var(--ok); }
  #summary {
    font-size: 10px; color: #6b6b74; margin-bottom: 6px; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #stats:empty, #summary:empty, #limits:empty, #sel:empty { display: none; }

  #sel {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    font-family: ui-monospace, monospace; font-size: 10.5px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 7px;
  }
  #sel .selid { color: var(--accent); }
  #sel .selname { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sel .selmeta { color: var(--muted); flex: none; }
  #sel button {
    flex: none; border: 1px solid var(--border); background: transparent;
    border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 11px;
    padding: 1px 6px; line-height: 1.4;
  }
  #sel button:first-of-type { margin-left: auto; }
  #sel button:hover { background: var(--bg); color: var(--text); }

  #limits { margin-bottom: 6px; }
  .lim { margin-bottom: 5px; }
  .lim .lrow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; margin-bottom: 2px;
  }
  .lim .lname { color: var(--text); font-weight: 500; }
  .lim .lmeta { color: var(--muted); font-family: ui-monospace, monospace; }
  .lim .track {
    height: 4px; border-radius: 2px; background: var(--border); overflow: hidden;
  }
  .lim .fill { height: 100%; border-radius: 2px; background: var(--ok); transition: width .3s; }
  .lim .fill.warn { background: var(--pend); }
  .lim .fill.hot { background: var(--err); }

  /* згорнутий режим — темна пігулка */
  body.mini { padding: 0; cursor: pointer; }
  body.mini .row { margin: 0; height: 36px; padding: 0 10px; gap: 6px; }
  body.mini #log, body.mini #server, body.mini #status, body.mini #count,
  body.mini #stats, body.mini #summary, body.mini #limits, body.mini #sel { display: none; }
  body.mini #brand { display: inline; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <span id="dot" class="pending"></span>
    <span id="brand">Mistok</span>
    <span id="status">connecting…</span>
    <span id="count">0</span>
    <span id="server">:8787</span>
    <button id="toggle" title="Згорнути / розгорнути">–</button>
  </div>
  <div id="sel"></div>
  <div id="limits"></div>
  <div id="stats"></div>
  <div id="summary"></div>
  <pre id="log"></pre>

<script>
const SERVER = "ws://localhost:8787/plugin";
const dotEl = document.getElementById("dot");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const logEl = document.getElementById("log");
let ws = null;
let reconnectTimer = null;
let execCount = 0;
const recentLog = [];

function classify(line) {
  if (line.startsWith("[ok]")) return "ok";
  if (line.startsWith("[err]") || line.startsWith("[drop]") || line.startsWith("[send]")) return "err";
  if (line.startsWith("[exec✎]")) return "mut";
  if (line.startsWith("[exec]")) return "exec";
  if (line.startsWith("[shot]")) return "ok";
  return "ws";
}

// груба евристика: чи виглядає код як мутація файлу
const MUT_RE = /\b(create[A-Z]\w*\(|\.remove\(\)|setProperties|appendChild|insertChild|\.(fills|strokes|characters)\s*=|\bresize\(|setBoundVariable|cloneNext|setText)/;

function log(line) {
  const ts = new Date().toTimeString().slice(0, 8);
  recentLog.push({ ts, line });
  if (recentLog.length > 80) recentLog.shift();
  logEl.innerHTML = recentLog.map(({ ts, line }) => {
    const cls = classify(line);
    const esc = line.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return `<div><span class="t">${ts}</span> <span class="${cls}">${esc}</span></div>`;
  }).join("");
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  dotEl.className = cls;
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : "?";
}

// ── Claude usage stats (pushed by bridge every 60s) ─────────────────────
function fmtTok(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}
function fmtMin(m) {
  if (m == null) return null;
  const h = Math.floor(m / 60);
  return h ? h + "год " + (m % 60) + "хв" : m + "хв";
}
function fmtReset(iso) {
  if (!iso) return "";
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "";
  const m = Math.round(ms / 60000);
  const h = Math.floor(m / 60);
  if (h >= 48) return "через " + Math.round(h / 24) + "д";
  return "через " + (h ? h + "год " + (m % 60) + "хв" : m + "хв");
}
const LIM_NAMES = { session: "Сесія", weekly_all: "Тиждень" };
const limNotified = {};
function renderStats(s) {
  const c = s.claude || {};
  const parts = [];
  const dur = fmtMin(c.session_min);
  if (dur) parts.push('<span class="up">⏱ ' + dur + "</span>");
  if (c.project) parts.push("<b>" + c.project + "</b>");
  parts.push("сьогодні: <b>" + (c.msgs || 0) + "</b> msg");
  parts.push("↑" + fmtTok(c.in_tok || 0) + " ↓" + fmtTok(c.out_tok || 0));
  document.getElementById("stats").innerHTML = parts.join(" · ");
  document.getElementById("summary").textContent = c.summary || "";

  if (s.execs != null) {
    execCount = s.execs;
    countEl.textContent = s.execs;
    countEl.title = (s.avg_ms != null ? "avg " + s.avg_ms + "ms" : "") +
                    (s.errors ? " · errors " + s.errors : "");
  }

  const lims = (s.limits || []).filter(l => LIM_NAMES[l.kind] || (l.model && l.percent > 0));
  // попередження при підході до ліміту — раз на вікно ресету
  lims.forEach(l => {
    const hot = (l.percent || 0) >= 90 || l.severity === "critical" || l.severity === "high";
    const key = l.kind + (l.resets_at || "");
    if (hot && !limNotified[key]) {
      limNotified[key] = true;
      parent.postMessage({ pluginMessage: { type: "notify",
        text: "Claude " + (LIM_NAMES[l.kind] || l.model) + ": лишилось " + (100 - l.percent) + "%" } }, "*");
    }
  });
  document.getElementById("limits").innerHTML = lims.map(l => {
    const used = Math.max(0, Math.min(100, l.percent || 0));
    const cls = used >= 80 || l.severity === "critical" ? "hot"
              : used >= 50 || l.severity === "warning" ? "warn" : "";
    const name = LIM_NAMES[l.kind] || l.model;
    return '<div class="lim">' +
      '<div class="lrow"><span class="lname">' + name + "</span>" +
      '<span class="lmeta">' + (100 - used) + "% left · " + fmtReset(l.resets_at) + "</span></div>" +
      '<div class="track"><div class="fill ' + cls + '" style="width:' + used + '%"></div></div></div>';
  }).join("");
}

function connect() {
  clearTimeout(reconnectTimer);
  setStatus("connecting…", "pending");
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setStatus("connected", "ok");
    log("[ws] connected");
    try { ws.send(JSON.stringify({ type: "hello", version: "2.1" })); } catch (e) {}
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      execCount++;
      countEl.textContent = execCount;
      const tag = MUT_RE.test(msg.code || "") ? "[exec✎]" : "[exec]";
      log(`${tag} ${shortId(msg.id)} code=${(msg.code || "").length}b`);
      parent.postMessage({ pluginMessage: { type: "exec", id: msg.id, code: msg.code } }, "*");
    } else if (msg.type === "stats") {
      renderStats(msg);
    } else if (msg.type === "ping") {
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    }
  };

  ws.onerror = () => {
    setStatus("error", "err");
    log("[ws] error");
  };

  ws.onclose = () => {
    setStatus("retrying…", "err");
    log("[ws] disconnected");
    reconnectTimer = setTimeout(connect, 2000);
  };
}

// ── згортання ────────────────────────────────────────────────────────────
let mini = false;
const toggleEl = document.getElementById("toggle");

function setMini(next, tell) {
  mini = next;
  document.body.classList.toggle("mini", mini);
  toggleEl.textContent = mini ? "+" : "–";
  if (tell) parent.postMessage({ pluginMessage: { type: "ui", mini } }, "*");
}

toggleEl.onclick = (e) => { e.stopPropagation(); setMini(!mini, true); };
// у згорнутому стані клік будь-де розгортає
document.body.onclick = () => { if (mini) setMini(false, true); };

// ── selection row ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}
function copyText(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function renderSel(m) {
  const el = document.getElementById("sel");
  if (!m.nodes || !m.nodes.length) { el.innerHTML = ""; return; }
  const n = m.nodes[0];
  const more = m.total > 1 ? " +" + (m.total - 1) : "";
  el.innerHTML =
    '<span class="selid">' + escHtml(n.id) + "</span>" +
    '<span class="selname">' + escHtml(n.name) + "</span>" +
    '<span class="selmeta">' + n.w + "×" + n.h + more + "</span>" +
    '<button id="copySel" title="Copy node id">⧉ id</button>' +
    '<button id="shotSel" title="PNG @2x → Desktop/mistok-shots">📷</button>';
  document.getElementById("copySel").onclick = (e) => {
    e.stopPropagation();
    copyText(m.nodes.map((x) => x.id).join(","));
    e.target.textContent = "✓";
    setTimeout(() => { e.target.textContent = "⧉ id"; }, 900);
  };
  document.getElementById("shotSel").onclick = (e) => {
    e.stopPropagation();
    parent.postMessage({ pluginMessage: { type: "shotsel" } }, "*");
  };
}

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "uistate") { setMini(!!m.mini, false); return; }
  if (m.type === "selection") { renderSel(m); return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try { ws.send(JSON.stringify(m)); } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
  else if (m.type === "file") log(`[shot] ${m.name} → Desktop/mistok-shots`);
  else if (m.type === "log") {/* skip — would spam */}
};

log("[ui] booting");
connect();
</script>
</body>
</html>
