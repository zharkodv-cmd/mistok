<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: dark; /* нативні контроли (select, скролбари) — у темній гамі */
    --bg: #1e1e22; --panel: #131316; --border: #2e2e34;
    --text: #e6e6ea; --muted: #8a8a93; --dim: #7f7f89;
    --ok: #4ade80; --err: #f87171; --pend: #fbbf24; --accent: #7dd3fc;
  }
  /* скролбар: тонка напівпрозора «пігулка» на прозорій доріжці, світлішає під курсором */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.13); background-clip: padding-box;
    border: 3px solid transparent; border-radius: 10px; min-height: 28px;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.26); }
  ::-webkit-scrollbar-thumb:active { background-color: rgba(125,211,252,.5); }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    margin: 0; padding: 8px; font-size: 11px;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 7px; flex: none; }
  #dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--pend); transition: background .2s;
  }
  #dot.ok  { background: var(--ok);  box-shadow: 0 0 6px rgba(74,222,128,.6); }
  #dot.err { background: var(--err); box-shadow: 0 0 6px rgba(248,113,113,.5); }
  #dot.pending { background: var(--pend); animation: pulse 1s infinite; }
  /* робота: крапка пульсує акцентом, поруч — назва задачі */
  #dot.busy { background: var(--accent); box-shadow: 0 0 6px rgba(125,211,252,.6); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* назва вже у тайтл-барі Figma — у відкритому режимі не дублюємо */
  #brand { display: none; font-weight: 600; letter-spacing: .2px; }
  #status {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #count {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 9px; padding: 1px 7px;
    margin-left: auto; flex: none;
  }
  #count.active {
    color: var(--accent);
    background: rgba(125,211,252,.08); border-color: rgba(125,211,252,.18);
  }
  button { transition: background .15s; }
  button:active { transform: translateY(1px); }
  #toggle, #undoBtn, #killBtn {
    border: 1px solid var(--border); background: transparent; border-radius: 5px;
    width: 22px; height: 22px; cursor: pointer; color: var(--muted);
    font-size: 14px; padding: 0; flex: none;
    display: grid; place-items: center;
  }
  #toggle:hover, #undoBtn:hover, #killBtn:hover { background: var(--panel); color: var(--text); }
  /* Cancel — лише поки працює фонова задача (після спільного правила, інакше воно перекриває) */
  #killBtn { display: none; color: var(--err); border-color: rgba(248,113,113,.3); }
  #killBtn.on { display: grid; }
  body.mini #undoBtn, body.mini #killBtn { display: none !important; }

  #limits:empty, #sel:empty { display: none; }

  /* кнопки операцій видно лише з виділенням */
  #ops { display: none; flex-wrap: wrap; gap: 5px; flex: none; }
  body.has-sel #ops { display: flex; }
  #ops button {
    flex: 1 1 calc(25% - 5px); height: 30px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 6px; color: var(--muted); cursor: pointer; padding: 0;
    display: grid; place-items: center; font-size: 13px;
  }
  #ops button:hover { background: var(--bg); color: var(--text); border-color: #3c3c44; }
  #ops button:disabled { opacity: .35; pointer-events: none; }
  #ops button svg, #sel button svg { display: block; }
  #ops button.on { color: var(--accent); border-color: rgba(125,211,252,.35); }

  #secform { display: none; gap: 6px; align-items: center; flex: none; }
  body.has-sel #secform.open { display: flex; }
  #secform label {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace;
  }
  #secform input {
    width: 52px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 11px; padding: 3px 5px;
    font-family: ui-monospace, monospace;
  }
  #secform input:focus { outline: none; border-color: rgba(125,211,252,.4); }
  #secform button {
    flex: none; margin-left: auto; height: 24px; padding: 0 14px; white-space: nowrap;
    border: 1px solid rgba(125,211,252,.35); background: rgba(125,211,252,.08);
    border-radius: 4px; color: var(--accent); cursor: pointer; font-size: 11px;
  }
  #secform button:hover { background: rgba(125,211,252,.16); }

  #sel {
    display: flex; align-items: center; gap: 6px; flex: none;
    font-family: ui-monospace, monospace;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 7px;
  }
  #sel .selid { color: var(--accent); }
  #sel .selname { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sel .selmeta { color: var(--muted); font-size: 10px; flex: none; }
  #sel button {
    flex: none; width: 26px; height: 24px; border: 1px solid var(--border);
    background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer;
    padding: 0; display: grid; place-items: center; font-size: 12px;
  }
  #sel button:first-of-type { margin-left: auto; }
  #sel button:hover { background: var(--bg); color: var(--text); }

  #limits { flex: none; display: flex; flex-direction: column; gap: 5px; }
  .lim .lrow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; margin-bottom: 2px;
  }
  .lim .lname { color: var(--text); font-weight: 500; font-size: 11px; }
  .lim .lmeta { color: var(--muted); font-family: ui-monospace, monospace; }
  .lim .track {
    height: 4px; border-radius: 2px; background: var(--border); overflow: hidden;
  }
  /* fill = скільки ЛИШИЛОСЬ (збігається з підписом «N% left») */
  .lim .fill { height: 100%; border-radius: 2px; background: var(--ok); transition: width .3s; }
  .lim .fill.warn { background: var(--pend); }
  .lim .fill.hot { background: var(--err); }

  #chatBox {
    flex: none; display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px;
  }
  body.mini #chatBox { display: none; }
  #chatOut {
    display: none; flex: none; flex-direction: column; gap: 6px;
    max-height: 240px; overflow-y: auto; overscroll-behavior: contain;
    margin-right: -4px; padding-right: 4px; /* скролбар у відступі, бульбашки його не торкаються */
  }
  #chatOut.open { display: flex; }
  .msg {
    max-width: 86%; padding: 6px 9px; border-radius: 9px; flex: none;
    font-size: 10.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user {
    align-self: flex-end; background: rgba(125,211,252,.10);
    border: 1px solid rgba(125,211,252,.22); color: var(--text);
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--bg);
    border: 1px solid var(--border); color: var(--text);
    border-bottom-left-radius: 3px;
  }
  .msg.bot.thinking { color: var(--muted); font-style: italic; }
  .msg img { display: block; max-width: 100%; border-radius: 6px; margin-top: 6px; border: 1px solid var(--border); }
  .msg .rmres {
    display: inline-block; margin-top: 6px; padding: 2px 8px; font-size: 10px;
    border: 1px solid var(--border); border-radius: 4px; background: transparent;
    color: var(--muted); cursor: pointer;
  }
  .msg .rmres:hover { color: var(--err); border-color: rgba(248,113,113,.4); }
  #chatRow { flex: none; display: flex; gap: 5px; }
  #chatIn {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 11px; padding: 6px 8px;
    font-family: inherit;
  }
  #chatIn:focus { outline: none; border-color: rgba(125,211,252,.4); }
  #chatIn::placeholder { color: var(--dim); }
  #chatMeta { flex: none; display: flex; gap: 4px; align-items: center; }
  #chatMeta .mlabel { font-size: 9px; color: var(--dim); }
  #chatMeta select + .mlabel { margin-left: 8px; }
  #chatMeta select {
    background: transparent; border: none; color: var(--dim); font-size: 10px;
    padding: 0; font-family: ui-monospace, monospace; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  #chatMeta select:hover, #chatMeta select:focus { color: var(--text); outline: none; }

  /* миттєвий тултіп: коротка назва дії */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
    background: #0c0c0e; color: var(--text); font-size: 9.5px; line-height: 1;
    padding: 4px 7px; border-radius: 4px; border: 1px solid var(--border);
    white-space: nowrap; pointer-events: none; z-index: 10;
  }

  /* згорнутий режим — темна пігулка */
  body.mini { padding: 0; cursor: pointer; display: block; }
  body.mini .row { margin: 0; height: 36px; padding: 0 10px; gap: 6px; }
  body.mini:hover { background: var(--panel); }
  body.mini #status, body.mini #count, body.mini #limits, body.mini #sel,
  body.mini #ops, body.mini #secform { display: none; }
  body.mini #brand { display: inline; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <span id="dot" class="pending"></span>
    <span id="brand">Mistok</span>
    <span id="status" title="ws://localhost:8787/plugin">connecting…</span>
    <span id="count" title="execs this bridge session">0</span>
    <button id="killBtn" data-tip="Cancel" title="Cancel running background tasks">✕</button>
    <button id="undoBtn" data-tip="Undo" title="Undo last action (triggerUndo)"></button>
    <button id="toggle" title="Collapse / expand">–</button>
  </div>
  <div id="limits"></div>
  <div id="sel"></div>
  <div id="ops"></div>
  <div id="secform">
    <label>pad <input id="secPad" type="number" value="250" min="0"></label>
    <label>gap <input id="secGap" type="number" value="100" min="0"></label>
    <label>cols <input id="secCols" type="number" value="1" min="1"></label>
    <button id="secApply" title="Wrap into a section and lay out">Apply</button>
  </div>
  <div id="chatBox">
    <div id="chatOut"></div>
    <div id="chatRow">
      <input id="chatIn" type="text" placeholder="Ask Claude… (Enter · URL = web import · /new)">
    </div>
    <div id="chatMeta">
      <span class="mlabel">✦</span>
      <select id="mSel" title="Model for chat and Claude buttons">
        <option value="">auto</option>
        <option value="haiku">haiku</option>
        <option value="sonnet">sonnet</option>
        <option value="opus">opus</option>
        <option value="fable">fable</option>
      </select>
      <span class="mlabel">↯</span>
      <select id="eSel" title="Effort for chat and Claude buttons">
        <option value="">auto</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
        <option value="xhigh">xhigh</option>
        <option value="max">max</option>
      </select>
    </div>
  </div>

<script>
const VERSION = "3.0";   // the bridge checks it (PLUGIN_VERSION in bridge.py) — bump both together
const SERVER = "ws://localhost:8787/plugin";
const MAX_H = 600;       // window cap (= UI_SIZE.open.maxH in code.js); the chat history shrinks to fit
const HIST_MAX = 40;
const $ = (id) => document.getElementById(id);
const dotEl = $("dot"), statusEl = $("status"), countEl = $("count");
const chatOut = $("chatOut"), chatIn = $("chatIn"), mSel = $("mSel"), eSel = $("eSel");
const post = (msg) => parent.postMessage({ pluginMessage: msg }, "*");
const notify = (text) => post({ type: "notify", text });
let ws = null;
let execCount = 0;
let blocked = null; // bridge refused us: Mistok already runs in another Figma file

const wsOpen = () => ws && ws.readyState === WebSocket.OPEN;
function wsSend(msg) {
  if (!wsOpen()) return false;
  try { ws.send(JSON.stringify(msg)); return true; } catch (e) { return false; }
}
function setStatus(text, cls) { statusEl.textContent = text; dotEl.className = cls; }
function setCount(n) { countEl.textContent = n; countEl.classList.toggle("active", n > 0); }
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ── задачі: op:<kind> — операція в плагіні, bg:<kind> — фонова робота bridge, chat ──
const tasks = new Map();   // key → label у статус-рядку
const bubbles = new Map(); // key → бульбашка «thinking…» цієї задачі в чаті
const BG_LABELS = { spell: "spellchecking (Claude)…", autolayout: "auto-layout planning (Claude)…",
  mobile: "mobile adaptation (Claude)…", recreate: "recreating design (Claude)…",
  redesign: "redesigning (Claude)…", prototype: "building prototype (Claude)…",
  imggen: "fetching photos (Freepik)…" };
let busySince = 0;
const kindOf = (key) => (key.startsWith("op:") || key.startsWith("bg:") ? key.slice(3) : key);
const taskKey = (task) => (task && task !== "chat" ? "bg:" + task : "chat");

function renderTasks() {
  const keys = [...tasks.keys()];
  for (const b of $("ops").children) b.disabled = keys.some((k) => k !== "chat" && kindOf(k) === b.dataset.kind);
  $("killBtn").classList.toggle("on", keys.some((k) => !k.startsWith("op:")));
  if (keys.length) {
    busySince = Date.now();
    dotEl.classList.add("busy");
    statusEl.textContent = tasks.get(keys[0]) + (keys.length > 1 ? " · +" + (keys.length - 1) : "");
  } else {
    setTimeout(() => {
      if (tasks.size) return;
      dotEl.classList.remove("busy");
      if (wsOpen()) statusEl.textContent = "";
    }, Math.max(0, 700 - (Date.now() - busySince)));
  }
  fitHeight();
}
function startTask(key, label) { tasks.set(key, label); renderTasks(); }
function endTask(key) { if (tasks.delete(key)) renderTasks(); }

// ── чат ──────────────────────────────────────────────────────────────────
let hist = [];      // персистентна історія (текст без картинок) → clientStorage через code.js
let histTimer = null;
function remember(role, text) {
  hist.push({ r: role, t: text });
  hist = hist.slice(-HIST_MAX);
  clearTimeout(histTimer);
  histTimer = setTimeout(() => post({ type: "chathist", hist }), 800);
}
function scrollChat() { chatOut.scrollTop = chatOut.scrollHeight; }
function addMsg(role, text, thinking, restoring) {
  const d = document.createElement("div");
  d.className = "msg " + role + (thinking ? " thinking" : "");
  d.textContent = text;
  chatOut.appendChild(d);
  while (chatOut.children.length > HIST_MAX) chatOut.firstChild.remove();
  chatOut.classList.add("open");
  if (!thinking && !restoring) remember(role, text);
  scrollChat();
  fitHeight();
  return d;
}
function showPending(key, text) {
  const el = bubbles.get(key);
  if (el) el.textContent = text;
  else bubbles.set(key, addMsg("bot", text, true));
}
function resolve(key, text, img, node) {
  let el = bubbles.get(key);
  bubbles.delete(key);
  if (el && el.isConnected) {
    el.classList.remove("thinking");
    el.textContent = text;
    remember("bot", text);
  } else el = addMsg("bot", text);
  if (img) {
    const im = document.createElement("img");
    im.src = img;
    im.onload = () => { scrollChat(); fitHeight(); };
    el.appendChild(im);
  }
  if (node) {
    const rb = document.createElement("button");
    rb.className = "rmres";
    rb.textContent = "✕ remove result";
    rb.onclick = () => { post({ type: "rmnode", id: node }); rb.textContent = "removed"; rb.disabled = true; };
    el.appendChild(rb);
  }
  scrollChat();
  fitHeight();
}
// задача зникла без відповіді (обрив з'єднання, bridge її вже не має)
function drop(key, why) {
  endTask(key);
  const el = bubbles.get(key);
  bubbles.delete(key);
  if (el) { el.classList.remove("thinking"); el.textContent = why; }
}

chatIn.onkeydown = (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  const text = chatIn.value.trim();
  if (!text) return;
  if (text === "/new") { // нова розмова: чистимо панель і сесію Claude у bridge
    if (tasks.has("chat")) return notify("Wait for the current reply (or ✕ to cancel)");
    chatIn.value = "";
    hist = [];
    post({ type: "chathist", hist });
    chatOut.replaceChildren();
    chatOut.classList.remove("open");
    wsSend({ type: "chatreset" });
    fitHeight();
    return;
  }
  const isUrl = /^https?:\/\/\S+$/.test(text);
  const key = isUrl ? "bg:import" : "chat";
  if (tasks.has(key)) return notify("Wait for the current reply (or ✕ to cancel)");
  if (!wsSend({ type: "chat", text, model: mSel.value || null, effort: eSel.value || null })) {
    return notify("Mistok bridge is offline — start it, then retry");
  }
  chatIn.value = "";
  addMsg("user", text);
  startTask(key, isUrl ? "importing page…" : "Claude: " + text.slice(0, 28) + "…");
  showPending(key, "thinking…");
};
const savePrefs = () => post({ type: "prefs", model: mSel.value, effort: eSel.value });
mSel.onchange = savePrefs;
eSel.onchange = savePrefs;

// ── ліміти Claude (bridge пушить раз на 60 с) ───────────────────────────
function fmtReset(iso) {
  const ms = iso ? new Date(iso) - Date.now() : 0;
  if (!(ms > 0)) return "";
  const m = Math.round(ms / 60000), h = Math.floor(m / 60);
  if (h >= 48) return "in " + Math.round(h / 24) + "d";
  return "in " + (h ? h + "h " + (m % 60) + "m" : m + "m");
}
const LIM_NAMES = { session: "Session", weekly_all: "Weekly" };
const limNotified = {};
function renderStats(s) {
  if (s.execs != null) {
    execCount = s.execs;
    setCount(execCount);
    countEl.title = "execs this bridge session" + (s.avg_ms != null ? " · avg " + s.avg_ms + "ms" : "") +
                    (s.errors ? " · errors " + s.errors : "");
  }
  const lims = (s.limits || []).filter((l) => LIM_NAMES[l.kind] || (l.model && l.percent > 0));
  $("limits").innerHTML = lims.map((l) => {
    const used = Math.max(0, Math.min(100, Math.round(l.percent || 0)));
    const left = 100 - used;
    const name = LIM_NAMES[l.kind] || l.model;
    const hot = used >= 80 || l.severity === "critical" || l.severity === "high";
    const key = l.kind + (l.model || "") + (l.resets_at || "");
    if (hot && !limNotified[key]) { limNotified[key] = true; notify("Claude " + name + ": " + left + "% left"); }
    const cls = hot ? "hot" : used >= 50 || l.severity === "warning" ? "warn" : "";
    return '<div class="lim"><div class="lrow"><span class="lname">' + escHtml(name) + "</span>" +
      '<span class="lmeta">' + left + "% left · " + fmtReset(l.resets_at) + "</span></div>" +
      '<div class="track"><div class="fill ' + cls + '" style="width:' + left + '%"></div></div></div>';
  }).join("");
  fitHeight();
}

// ── WebSocket до bridge ──────────────────────────────────────────────────
function connect() {
  if (!blocked) setStatus("connecting…", "pending");
  try { ws = new WebSocket(SERVER); } catch (e) { setTimeout(connect, 2000); return; }

  ws.onopen = () => {
    blocked = null;
    statusEl.title = SERVER;
    setStatus("", "ok");
    wsSend({ type: "hello", version: VERSION });
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (msg.type === "exec") {
      setCount(++execCount);
      post({ type: "exec", id: msg.id, code: msg.code });
    } else if (msg.type === "stats") {
      renderStats(msg);
    } else if (msg.type === "chatstatus") {
      const key = taskKey(msg.task);
      startTask(key, msg.text);
      showPending(key, msg.text);
    } else if (msg.type === "chatreply") {
      const key = taskKey(msg.task);
      endTask(key);
      resolve(key, msg.text, msg.img || null, msg.node || null);
    } else if (msg.type === "error") { // e.g. another plugin instance already connected
      blocked = msg.text;
    } else if (msg.type === "killed") { // що bridge уже не виконує — прибираємо з панелі
      for (const key of [...tasks.keys()]) {
        if (!key.startsWith("op:") && !(msg.running || []).includes(kindOf(key))) drop(key, "✕ stopped");
      }
    }
  };
  ws.onerror = () => setStatus("error", "err");
  ws.onclose = () => { // разом з bridge зникли і його фонові задачі
    for (const key of [...tasks.keys()]) if (!key.startsWith("op:")) drop(key, "(bridge disconnected)");
    if (blocked) { // стукаємо рідше: підключимось, щойно Mistok закриють у тому файлі
      setStatus("open in another file", "err");
      statusEl.title = blocked + " — close Mistok in that file to use it here";
    } else setStatus("retrying…", "err");
    setTimeout(connect, blocked ? 5000 : 2000);
  };
}

// ── заголовок: cancel / undo / згортання ────────────────────────────────
$("undoBtn").innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M6.5 3.5L3 7l3.5 3.5"/><path d="M3 7h6.5a3.5 3.5 0 013.5 3.5v2"/></svg>';
$("undoBtn").onclick = (e) => { e.stopPropagation(); post({ type: "undo" }); };
$("killBtn").onclick = (e) => {
  e.stopPropagation();
  if (!wsSend({ type: "kill" })) for (const key of [...tasks.keys()]) if (!key.startsWith("op:")) drop(key, "✕ stopped");
};

let mini = false;
function setMini(next, tell) {
  mini = next;
  document.body.classList.toggle("mini", mini);
  $("toggle").textContent = mini ? "+" : "–";
  if (tell) post({ type: "ui", mini });
  if (!mini) fitHeight();
}
$("toggle").onclick = (e) => { e.stopPropagation(); setMini(!mini, true); };
document.body.onclick = () => { if (mini) setMini(false, true); }; // згорнуте розгортається кліком будь-де

// авто-висота під контент; вище MAX_H стискається історія чату, щоб поле вводу лишалось видимим.
// scrollHeight body завжди ≥ висоти вікна, тому міряємо низ останнього видимого блока
function contentHeight() {
  let max = 0;
  for (const el of document.body.children) {
    if (el.tagName === "SCRIPT") continue;
    const r = el.getBoundingClientRect();
    if (r.height > 0) max = Math.max(max, r.bottom);
  }
  return Math.ceil(max + 8); // нижній padding
}
let fitQueued = false;
function fitHeight() {
  if (mini || fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => {
    fitQueued = false;
    chatOut.style.maxHeight = "";
    let h = contentHeight();
    if (h > MAX_H && chatOut.classList.contains("open")) {
      chatOut.style.maxHeight = Math.max(48, chatOut.clientHeight - (h - MAX_H)) + "px";
      h = contentHeight();
    }
    post({ type: "resize", h: Math.min(h, MAX_H) });
  });
}

// ── рядок виділення + кнопки операцій ───────────────────────────────────
function copyText(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function flash(btn, glyphHTML, revertHTML) {
  btn.innerHTML = glyphHTML;
  setTimeout(() => { btn.innerHTML = revertHTML; }, 900);
}

const OP_BTNS = [
  { kind: "clean", tip: "Clean", title: "Logical folders + rename (bg/image/item…) + ungroup + whole px" },
  { kind: "varsal", tip: "Spacing", title: "Auto-layout paddings/gaps → nearest variables" },
  { kind: "varscolor", tip: "Colors", title: "Colors/text → nearest variables (scope-aware)" },
  { kind: "textstyle", tip: "Styles", title: "Text nodes → local Text Styles (family+style+size)" },
  { kind: "autolayout", tip: "Layout", title: "Organize free-placed elements into logical auto-layout (rows/cols, bg → absolute) — Claude plans" },
  { kind: "mobile", tip: "Mobile", title: "Clone the frame next to it as a 375px mobile version — reflowed auto-layouts, adapted paddings & type" },
  { kind: "sectionize", tip: "Section", title: "Wrap selection into a Section (pad/gap/cols below)" },
  { kind: "grid", tip: "Grid", title: "Snap children to the frame's column layout grid (x and width)" },
  { kind: "imgreuse", tip: "Reuse", title: "Image slots ← relevant images from the whole file" },
  { kind: "imggen", tip: "Photos", title: "Image slots ← stock photos: Freepik API (FREEPIK_API_KEY), else a request for a Claude session" },
  { kind: "spell", tip: "Spell", title: "Spellcheck all texts via Claude: fixes applied automatically, styles kept" },
  { kind: "redesign", tip: "Redesign", title: "Any selection → awwwards reference hunt → redesigned next to it by Claude" },
  { kind: "prototype", tip: "Prototype", title: "Wireframe/sketch/texts → minimalist b/w prototype (Inter) next to it, by Claude" },
  { kind: "lint", tip: "Lint", title: "Read-only audit: unbound colors/spacing, missing text styles, default names, fractional px, off-grid" },
  { kind: "contrast", tip: "Contrast", title: "Read-only WCAG AA contrast check of texts against their actual backgrounds" },
  { kind: "recreate", tip: "Design", title: "Screenshot → pixel-perfect editable recreation next to it, by Claude" },
];
$("ops").innerHTML = OP_BTNS.map((b) =>
  '<button data-kind="' + b.kind + '" data-tip="' + b.tip + '" title="' + b.title + '">' + ICONS[b.kind] + "</button>").join("");
for (const btn of $("ops").children) {
  btn.onclick = (e) => {
    e.stopPropagation();
    const kind = btn.dataset.kind;
    if (kind === "sectionize") {
      btn.classList.toggle("on", $("secform").classList.toggle("open"));
      fitHeight();
      return;
    }
    if (BG_LABELS[kind] && !wsOpen()) return notify("Mistok bridge is offline — this button needs it");
    post({ type: "op", kind, params: { model: mSel.value || null, effort: eSel.value || null } });
    startTask("op:" + kind, btn.dataset.tip + "…");
  };
}
$("secApply").onclick = (e) => {
  e.stopPropagation();
  post({ type: "op", kind: "sectionize",
    params: { pad: $("secPad").value, gap: $("secGap").value, cols: $("secCols").value } });
};

function renderSel(m) {
  const el = $("sel");
  document.body.classList.toggle("has-sel", !!(m.nodes && m.nodes.length));
  if (!m.nodes || !m.nodes.length) { el.innerHTML = ""; fitHeight(); return; }
  const n = m.nodes[0];
  const more = m.total > 1 ? " +" + (m.total - 1) : "";
  el.innerHTML =
    '<span class="selid">' + escHtml(n.id) + "</span>" +
    '<span class="selname">' + escHtml(n.name) + "</span>" +
    '<span class="selmeta">' + n.w + "×" + n.h + more + "</span>" +
    '<button id="copySel" data-tip="Copy id" title="Copy node id">' + ICONS.copy + "</button>" +
    '<button id="implSel" data-tip="Implement" title="Copy an implement-this-design prompt for Claude Code">' + ICONS.impl + "</button>" +
    '<button id="shotSel" data-tip="Shot" title="PNG @2x → clipboard + Desktop/mistok-shots">' + ICONS.shot + "</button>";
  const ids = m.nodes.map((x) => x.id);
  $("copySel").onclick = (e) => {
    e.stopPropagation();
    copyText(ids.join(","));
    flash(e.currentTarget, ICONS.ok, ICONS.copy);
  };
  $("implSel").onclick = (e) => {
    e.stopPropagation();
    const list = m.nodes.map((x) => "`" + x.id + "` «" + x.name + "» (" + x.w + "×" + x.h + ")").join(", ");
    copyText(
      "Implement this design from Figma (Mistok bridge):\n" +
      "- node" + (ids.length > 1 ? "s" : "") + ": " + list + "\n" +
      "- spec: mistok spec " + ids[0] + " --depth 6\n" +
      "- screenshot: mistok shot " + ids[0] + " /tmp/design.png --scale 2\n" +
      "Follow the project's rules (e.g. .claude/rules/mistok.md): exact texts, colors from variables."
    );
    flash(e.currentTarget, ICONS.ok, ICONS.impl);
  };
  $("shotSel").onclick = (e) => {
    e.stopPropagation();
    post({ type: "shotsel" });
    flash(e.currentTarget, ICONS.wait, ICONS.shot);
  };
  fitHeight();
}

// ── повідомлення з code.js ───────────────────────────────────────────────
window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "uistate") return setMini(!!m.mini, false);
  if (m.type === "chathiststate") {
    hist = Array.isArray(m.hist) ? m.hist : [];
    for (const h of hist) addMsg(h.r === "user" ? "user" : "bot", h.t, false, true);
    return;
  }
  if (m.type === "prefsstate") {
    if (m.model != null) mSel.value = m.model;
    if (m.effort != null) eSel.value = m.effort;
    return;
  }
  if (m.type === "selection") return renderSel(m);
  if (m.type === "opreport") {
    endTask("op:" + m.kind);
    // у Claude-кнопок після звіту працює bridge — лоадер тримаємо до його chatreply
    if (BG_LABELS[m.kind] && !m.error && wsOpen()) startTask("bg:" + m.kind, BG_LABELS[m.kind]);
  }
  // решта — для bridge: результати exec, логи, звіти, запити фонових задач, 📷
  if (!wsSend(m) && (m.type === "file" || m.type.endsWith("request"))) {
    notify("Mistok bridge is offline — start it, then retry");
  }
};

connect();
fitHeight();
