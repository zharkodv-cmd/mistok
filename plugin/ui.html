<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #1e1e22; --panel: #131316; --border: #2e2e34;
    --text: #e6e6ea; --muted: #8a8a93; --dim: #7f7f89;
    --ok: #4ade80; --err: #f87171; --pend: #fbbf24; --accent: #7dd3fc;
  }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    margin: 0; padding: 8px; font-size: 11px;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 7px; flex: none; }
  #dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--pend); transition: background .2s;
  }
  #dot.ok  { background: var(--ok);  box-shadow: 0 0 6px rgba(74,222,128,.6); }
  #dot.err { background: var(--err); box-shadow: 0 0 6px rgba(248,113,113,.5); }
  #dot.pending { background: var(--pend); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* назва вже у тайтл-барі Figma — у відкритому режимі не дублюємо */
  #brand { display: none; font-weight: 600; letter-spacing: .2px; }
  #status { font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); }
  #count {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 9px; padding: 1px 7px;
    margin-left: auto;
  }
  #count.active {
    color: var(--accent);
    background: rgba(125,211,252,.08); border-color: rgba(125,211,252,.18);
  }
  button { transition: background .15s; }
  button:active { transform: translateY(1px); }
  #toggle, #undoBtn {
    border: 1px solid var(--border); background: transparent; border-radius: 5px;
    width: 22px; height: 22px; cursor: pointer; color: var(--muted);
    font-size: 14px; padding: 0; flex: none;
    display: grid; place-items: center;
  }
  #toggle:hover, #undoBtn:hover { background: var(--panel); color: var(--text); }
  body.mini #undoBtn { display: none; }

  #stats {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none;
  }
  #stats b { color: var(--text); font-weight: 500; }
  #summary {
    font-size: 10px; color: var(--dim); font-style: italic; flex: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #summary:empty, #limits:empty, #sel:empty, #ops:empty { display: none; }

  #ops { display: flex; gap: 5px; flex: none; }
  #ops:empty { display: none; }
  #ops button {
    flex: 1; height: 30px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 6px; color: var(--muted); cursor: pointer; padding: 0;
    display: grid; place-items: center; font-size: 13px;
  }
  #ops button:hover { background: var(--bg); color: var(--text); border-color: #3c3c44; }
  #ops button svg, #sel button svg { display: block; }
  #ops button.on { color: var(--accent); border-color: rgba(125,211,252,.35); }

  #secform { display: none; gap: 6px; align-items: center; flex: none; }
  #secform.open { display: flex; }
  #secform label {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace;
  }
  #secform input {
    width: 52px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 11px; padding: 3px 5px;
    font-family: ui-monospace, monospace;
  }
  #secform input:focus { outline: none; border-color: rgba(125,211,252,.4); }
  #secform button {
    flex: 1; height: 24px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 4px; color: var(--text); cursor: pointer; font-size: 11px;
  }
  #secform button:hover { background: var(--bg); }

  #sel {
    display: flex; align-items: center; gap: 6px; flex: none;
    font-family: ui-monospace, monospace;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 7px;
  }
  #sel .selid { color: var(--accent); }
  #sel .selname { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sel .selmeta { color: var(--muted); font-size: 10px; flex: none; }
  #sel button {
    flex: none; width: 26px; height: 24px; border: 1px solid var(--border);
    background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer;
    padding: 0; display: grid; place-items: center; font-size: 12px;
  }
  #sel button:first-of-type { margin-left: auto; }
  #sel button:hover { background: var(--bg); color: var(--text); }

  #limits { flex: none; display: flex; flex-direction: column; gap: 5px; }
  .lim .lrow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; margin-bottom: 2px;
  }
  .lim .lname { color: var(--text); font-weight: 500; font-size: 11px; }
  .lim .lmeta { color: var(--muted); font-family: ui-monospace, monospace; }
  .lim .track {
    height: 4px; border-radius: 2px; background: var(--border); overflow: hidden;
  }
  /* fill = скільки ЛИШИЛОСЬ (збігається з підписом «N% left») */
  .lim .fill { height: 100%; border-radius: 2px; background: var(--ok); transition: width .3s; }
  .lim .fill.warn { background: var(--pend); }
  .lim .fill.hot { background: var(--err); }

  #chatOut {
    display: none; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 10.5px; line-height: 1.5;
    max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    color: var(--text); flex: none;
  }
  #chatOut.open { display: block; }
  #chatOut.thinking { color: var(--muted); font-style: italic; }
  #chatRow { flex: none; }
  #chatIn {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 11px; padding: 6px 8px;
    font-family: inherit;
  }
  #chatIn:focus { outline: none; border-color: rgba(125,211,252,.4); }
  #chatIn::placeholder { color: var(--dim); }

  /* миттєвий тултіп: коротка назва дії */
  [data-tip] { position: relative; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
    background: #0c0c0e; color: var(--text); font-size: 9.5px; line-height: 1;
    padding: 4px 7px; border-radius: 4px; border: 1px solid var(--border);
    white-space: nowrap; pointer-events: none; z-index: 10;
  }

  /* згорнутий режим — темна пігулка */
  body.mini { padding: 0; cursor: pointer; display: block; }
  body.mini .row { margin: 0; height: 36px; padding: 0 10px; gap: 6px; }
  body.mini:hover { background: var(--panel); }
  body.mini #server, body.mini #status, body.mini #count,
  body.mini #stats, body.mini #summary, body.mini #limits, body.mini #sel,
  body.mini #ops, body.mini #secform, body.mini #chatOut, body.mini #chatRow { display: none; }
  body.mini #brand { display: inline; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <span id="dot" class="pending"></span>
    <span id="brand">Mistok</span>
    <span id="status" title="ws://localhost:8787/plugin">connecting…</span>
    <span id="count" title="виконань за сесію bridge">0</span>
    <button id="undoBtn" data-tip="Undo" title="Відкотити останню дію (triggerUndo)"></button>
    <button id="toggle" title="Згорнути / розгорнути">–</button>
  </div>
  <div id="limits"></div>
  <div id="sel"></div>
  <div id="ops"></div>
  <div id="secform">
    <label>pad <input id="secPad" type="number" value="250"></label>
    <label>gap <input id="secGap" type="number" value="100"></label>
    <button id="secApply" title="Загорнути в секцію і розкласти">→ Section</button>
  </div>
  <div id="stats">очікую статистику…</div>
  <div id="summary"></div>
  <div id="chatOut"></div>
  <div id="chatRow">
    <input id="chatIn" type="text" placeholder="Спитай Claude… (Enter)">
  </div>

<script>
const SERVER = "ws://localhost:8787/plugin";
const dotEl = document.getElementById("dot");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
let ws = null;
let reconnectTimer = null;
let execCount = 0;


function log(_line) {} // лог-панель прибрано; події видно через статус-дот і figma.notify

function setStatus(text, cls) {
  statusEl.textContent = text;
  dotEl.className = cls;
}

function setCount(n) {
  countEl.textContent = n;
  countEl.classList.toggle("active", n > 0);
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : "?";
}

// ── Claude usage stats (pushed by bridge every 60s) ─────────────────────
function fmtTok(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}
function fmtMin(m) {
  if (m == null) return null;
  const h = Math.floor(m / 60);
  return h ? h + "год " + (m % 60) + "хв" : m + "хв";
}
function fmtReset(iso) {
  if (!iso) return "";
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "";
  const m = Math.round(ms / 60000);
  const h = Math.floor(m / 60);
  if (h >= 48) return "через " + Math.round(h / 24) + "д";
  return "через " + (h ? h + "год " + (m % 60) + "хв" : m + "хв");
}
const LIM_NAMES = { session: "Сесія", weekly_all: "Тиждень" };
const limNotified = {};
function renderStats(s) {
  const c = s.claude || {};
  const parts = [];
  const dur = fmtMin(c.session_min);
  if (dur) parts.push("⏱ " + dur);
  if (c.project) parts.push("<b>" + c.project + "</b>");
  parts.push("сьогодні: <b>" + (c.msgs || 0) + "</b> msg");
  parts.push("↑" + fmtTok(c.in_tok || 0) + " ↓" + fmtTok(c.out_tok || 0));
  document.getElementById("stats").innerHTML = parts.join(" · ");
  document.getElementById("summary").textContent = c.summary || "";

  if (s.execs != null) {
    execCount = s.execs;
    setCount(s.execs);
    countEl.title = "виконань за сесію bridge" +
                    (s.avg_ms != null ? " · avg " + s.avg_ms + "ms" : "") +
                    (s.errors ? " · errors " + s.errors : "");
  }

  const lims = (s.limits || []).filter(l => LIM_NAMES[l.kind] || (l.model && l.percent > 0));
  // попередження при підході до ліміту — раз на вікно ресету, поріг = «гарячий» бар
  lims.forEach(l => {
    const hot = (l.percent || 0) >= 80 || l.severity === "critical" || l.severity === "high";
    const key = l.kind + (l.resets_at || "");
    if (hot && !limNotified[key]) {
      limNotified[key] = true;
      parent.postMessage({ pluginMessage: { type: "notify",
        text: "Claude " + (LIM_NAMES[l.kind] || l.model) + ": лишилось " + (100 - l.percent) + "%" } }, "*");
    }
  });
  document.getElementById("limits").innerHTML = lims.map(l => {
    const used = Math.max(0, Math.min(100, l.percent || 0));
    const left = 100 - used;
    const cls = used >= 80 || l.severity === "critical" ? "hot"
              : used >= 50 || l.severity === "warning" ? "warn" : "";
    const name = LIM_NAMES[l.kind] || l.model;
    return '<div class="lim">' +
      '<div class="lrow"><span class="lname">' + name + "</span>" +
      '<span class="lmeta">' + left + "% left · " + fmtReset(l.resets_at) + "</span></div>" +
      '<div class="track"><div class="fill ' + cls + '" style="width:' + left + '%"></div></div></div>';
  }).join("");
  fitHeight();
}

function connect() {
  clearTimeout(reconnectTimer);
  setStatus("connecting…", "pending");
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setStatus("connected", "ok");
    log("[ws] connected");
    try { ws.send(JSON.stringify({ type: "hello", version: "2.1" })); } catch (e) {}
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      setCount(++execCount);
      parent.postMessage({ pluginMessage: { type: "exec", id: msg.id, code: msg.code } }, "*");
    } else if (msg.type === "stats") {
      renderStats(msg);
    } else if (msg.type === "chatstatus") {
      chatShow(msg.text, true);
    } else if (msg.type === "chatreply") {
      chatShow(msg.text, false);
    } else if (msg.type === "ping") {
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    }
  };

  ws.onerror = () => {
    setStatus("error", "err");
    log("[ws] error");
  };

  ws.onclose = () => {
    setStatus("retrying…", "err");
    log("[ws] disconnected");
    reconnectTimer = setTimeout(connect, 2000);
  };
}

// ── undo ─────────────────────────────────────────────────────────────────
const undoBtn = document.getElementById("undoBtn");
undoBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M6.5 3.5L3 7l3.5 3.5"/><path d="M3 7h6.5a3.5 3.5 0 013.5 3.5v2"/></svg>';
undoBtn.onclick = (e) => {
  e.stopPropagation();
  parent.postMessage({ pluginMessage: { type: "undo" } }, "*");
};

// ── чат із Claude (headless через bridge) ────────────────────────────────
const chatOut = document.getElementById("chatOut");
const chatIn = document.getElementById("chatIn");
function chatShow(text, thinking) {
  chatOut.textContent = text || "";
  chatOut.classList.toggle("open", !!text);
  chatOut.classList.toggle("thinking", !!thinking);
  fitHeight();
}
chatIn.onkeydown = (e) => {
  if (e.key !== "Enter") return;
  const text = chatIn.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) { chatShow("bridge не підключений", false); return; }
  ws.send(JSON.stringify({ type: "chat", text }));
  chatIn.value = "";
  chatShow("думаю…", true);
};

// ── selection row ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}
function copyText(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function flash(btn, glyphHTML, revertHTML) {
  btn.innerHTML = glyphHTML;
  setTimeout(() => { btn.innerHTML = revertHTML; }, 900);
}
const I = (paths) =>
  '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' + paths + "</svg>";
const ICONS = {
  clean: I('<path d="M12.5 2.5L7 8"/><path d="M6.2 8.8l-2.9 3.4c-.5.6-.3 1.3.4 1.5l1.6.4c1.9.4 3.4-.4 4-2.2l.6-1.7-3.7-1.4z" fill="currentColor" stroke="none"/><path d="M13.5 5.5h-2M12.8 7.8l-1.4-.7"/>'),
  rename: I('<path d="M10.8 2.7l2.5 2.5L5.5 13H3v-2.5l7.8-7.8z"/><path d="M9.3 4.2l2.5 2.5"/>'),
  varsal: I('<path d="M2.5 3v10M13.5 3v10"/><path d="M5.3 8h5.4M6.8 6.3L5.3 8l1.5 1.7M9.2 6.3L10.7 8l-1.5 1.7"/>'),
  varscolor: I('<path d="M8 2.2S4.2 6.8 4.2 9.4a3.8 3.8 0 007.6 0C11.8 6.8 8 2.2 8 2.2z"/><path d="M6.3 9.8a1.7 1.7 0 001.5 1.6"/>'),
  textstyle: I('<path d="M3 4.8V3h10v1.8M8 3v10M6.2 13h3.6"/>'),
  sectionize: I('<rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/>'),
  imgreuse: I('<rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><circle cx="6" cy="6.5" r="1"/><path d="M2.5 11l3-3 2.5 2.5L11 7.5l2.5 2.5"/>'),
  imggen: I('<path d="M8 2.5l1.2 3.3L12.5 7 9.2 8.2 8 11.5 6.8 8.2 3.5 7l3.3-1.2L8 2.5z"/><path d="M12.5 11l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5.5-1.2z"/>'),
  autolayout: I('<rect x="3.5" y="2.5" width="9" height="4.5" rx="1"/><rect x="3.5" y="9" width="9" height="4.5" rx="1"/>'),
  copy: I('<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1.5 1.5 0 00-1.5-1.5H4A1.5 1.5 0 002.5 3v5A1.5 1.5 0 004 9.5h.5"/>'),
  shot: I('<path d="M2.5 5.8A1.3 1.3 0 013.8 4.5h1.4l1-1.5h3.6l1 1.5h1.4a1.3 1.3 0 011.3 1.3v6.4a1.3 1.3 0 01-1.3 1.3H3.8a1.3 1.3 0 01-1.3-1.3V5.8z"/><circle cx="8" cy="8.8" r="2.3"/>'),
  ok: '<span style="color:var(--ok)">✓</span>',
  wait: "⏳",
};
const OP_BTNS = [
  { kind: "clean", tip: "Clean", title: "Rename (bg/image/item/текст) + розгрупування + цілі px + відступи → variables" },
  { kind: "varsal", tip: "Spacing", title: "Auto-layout відступи/гапи → найближчі variables" },
  { kind: "varscolor", tip: "Colors", title: "Кольори/текст → найближчі variables" },
  { kind: "textstyle", tip: "Styles", title: "Текстові ноди → локальні Text Styles (family+style+size)" },
  { kind: "autolayout", tip: "Layout", title: "Логічно організувати вільні елементи фрейма в auto-layout (рядки/колонки, фон → absolute)" },
  { kind: "sectionize", tip: "Section", title: "Загорнути виділене в Section і розкласти (pad/gap нижче)" },
  { kind: "imgreuse", tip: "Reuse", title: "Плейсхолдери ← картинки, що вже використовуються на сторінці" },
  { kind: "imggen", tip: "Magnific", title: "Запит на преміум-картинки через Magnific → виконує Claude" },
];
function renderOps(show) {
  const el = document.getElementById("ops");
  const form = document.getElementById("secform");
  if (!show) { el.innerHTML = ""; form.classList.remove("open"); return; }
  el.innerHTML = OP_BTNS.map((b) =>
    '<button data-kind="' + b.kind + '" data-tip="' + b.tip + '" title="' + b.title + '">' +
    ICONS[b.kind] + "</button>").join("");
  el.querySelectorAll("button").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (btn.dataset.kind === "sectionize") {
        form.classList.toggle("open");
        btn.classList.toggle("on", form.classList.contains("open"));
        fitHeight();
        return;
      }
      parent.postMessage({ pluginMessage: { type: "op", kind: btn.dataset.kind } }, "*");
      flash(btn, ICONS.wait, ICONS[btn.dataset.kind]);
    };
  });
}
document.getElementById("secApply").onclick = (e) => {
  e.stopPropagation();
  parent.postMessage({ pluginMessage: { type: "op", kind: "sectionize", params: {
    pad: Number(document.getElementById("secPad").value) || 250,
    gap: Number(document.getElementById("secGap").value) || 100,
  } } }, "*");
};

function renderSel(m) {
  const el = document.getElementById("sel");
  renderOps(m.nodes && m.nodes.length);
  if (!m.nodes || !m.nodes.length) { el.innerHTML = ""; fitHeight(); return; }
  const n = m.nodes[0];
  const more = m.total > 1 ? " +" + (m.total - 1) : "";
  el.innerHTML =
    '<span class="selid">' + escHtml(n.id) + "</span>" +
    '<span class="selname">' + escHtml(n.name) + "</span>" +
    '<span class="selmeta">' + n.w + "×" + n.h + more + "</span>" +
    '<button id="copySel" data-tip="Copy id" title="Copy node id">' + ICONS.copy + "</button>" +
    '<button id="shotSel" data-tip="Shot" title="PNG @2x → буфер + Desktop/mistok-shots">' + ICONS.shot + "</button>";
  const copyBtn = document.getElementById("copySel");
  copyBtn.onclick = (e) => {
    e.stopPropagation();
    copyText(m.nodes.map((x) => x.id).join(","));
    flash(copyBtn, ICONS.ok, ICONS.copy);
  };
  const shotBtn = document.getElementById("shotSel");
  shotBtn.onclick = (e) => {
    e.stopPropagation();
    parent.postMessage({ pluginMessage: { type: "shotsel" } }, "*");
    flash(shotBtn, ICONS.wait, ICONS.shot);
  };
  fitHeight();
}

// ── згортання ────────────────────────────────────────────────────────────
let mini = false;
const toggleEl = document.getElementById("toggle");

function setMini(next, tell) {
  mini = next;
  document.body.classList.toggle("mini", mini);
  toggleEl.textContent = mini ? "+" : "–";
  if (tell) parent.postMessage({ pluginMessage: { type: "ui", mini } }, "*");
  if (!mini) fitHeight();
}

// авто-висота: вікно підганяється під контент
// (scrollHeight body завжди ≥ висоти вікна, тому міряємо низ останнього видимого блока)
function contentHeight() {
  let max = 0;
  for (const el of document.body.children) {
    if (el.tagName === "SCRIPT") continue;
    const r = el.getBoundingClientRect();
    if (r.height > 0) max = Math.max(max, r.bottom);
  }
  return Math.ceil(max + 8); // нижній padding
}
function fitHeight() {
  if (mini) return;
  requestAnimationFrame(() => {
    parent.postMessage({ pluginMessage: { type: "resize", h: contentHeight() } }, "*");
  });
}

toggleEl.onclick = (e) => { e.stopPropagation(); setMini(!mini, true); };
// у згорнутому стані клік будь-де розгортає
document.body.onclick = () => { if (mini) setMini(false, true); };

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "uistate") { setMini(!!m.mini, false); return; }
  if (m.type === "selection") { renderSel(m); return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try { ws.send(JSON.stringify(m)); } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
  else if (m.type === "file") log(`[shot] ${m.name} → буфер + mistok-shots`);
  else if (m.type === "opreport") log(`[op] ${m.summary}`);
  else if (m.type === "log") {/* skip — would spam */}
};

log("[ui] booting");
connect();
fitHeight();
</script>
</body>
</html>
